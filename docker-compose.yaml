version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: locky_postgres_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: locky-db
      POSTGRES_PASSWORD: locky_dev_password_123
      POSTGRES_DB: locky-db
    volumes:
      # Use named volume (Recommended):
      - locky_postgres_data:/var/lib/postgresql/data

      # OR if using a local host directory, uncomment below and use :Z
      # - ./postgres_data:/var/lib/postgresql/data:Z

volumes:
  locky_postgres_data:
